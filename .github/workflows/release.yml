name: Release

on:
  release:
    types: [published]
# louk-fork: amd64 only, GHCR only (upstream also builds arm64 and pushes to Docker Hub via a manifest-merge job).
jobs:
  build:
    name: Build (linux/amd64)
    # louk-fork: pinned to the last known-good image (ubuntu-latest is now 26.04).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          MAJOR="v${VERSION%%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          # Disable BuildKit's automatic attestation manifests. These embed an
          # extra image-index entry per platform that registries (e.g. GHCR)
          # surface as bogus `unknown/unknown` architectures.
          provenance: false
          sbom: false
          push: true
          # Empty unless the repository variable CARGO_FEATURES is set.
          build-args: CARGO_FEATURES=${{ vars.CARGO_FEATURES }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.major }}
            ghcr.io/${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.image_name }}-buildcache:linux-amd64
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.image_name }}-buildcache:linux-amd64,compression=zstd,mode=max
